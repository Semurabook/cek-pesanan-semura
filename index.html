<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEMURA - Cek Pesanan</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #f9f6f0;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
    }
    .logo {
      width: 140px;
      margin-bottom: 10px;
    }
    h2 {
      margin: 5px 0 5px 0;
      color: #333;
      font-size: 22px;
      font-weight: 700;
    }
    .subtitle {
      font-size: 13px;
      color: #777;
      margin-bottom: 25px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 15px;
    }
    label {
      font-size: 13px;
      font-weight: 600;
      color: #444;
      display: block;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      background-color: #fcfcfc;
      outline: none;
      transition: all 0.2s;
    }
    input[type="text"]:focus {
      border-color: #8B4513;
      background-color: #fff;
    }
    .btn-submit {
      width: 100%;
      padding: 13px;
      background-color: #7A3E3E;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background-color: #5d2e2e;
    }
    .loading {
      display: none;
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }
    /* Card Hasil Pencarian */
    #hasilPencarian {
      margin-top: 25px;
      text-align: left;
    }
    .card {
      background: #fffaf5;
      border: 1px solid #f0e6df;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .card-title {
      font-weight: bold;
      font-size: 15px;
      color: #7A3E3E;
      border-bottom: 1px dashed #e2d2c5;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .card-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
      color: #555;
    }
    .card-row strong {
      color: #333;
    }
    .badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
    }
    .badge-done { background: #e6f4ea; color: #137333; }
    .badge-pending { background: #fef7e0; color: #b06000; }
    
    /* Footer Info */
    .features {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      font-size: 11px;
      color: #888;
    }
    .footer-text {
      margin-top: 15px;
      font-size: 11px;
      color: #aaa;
    }
  </style>
</head>
<body>

<div class="container">
  <img src="logo.png" alt="SEMURA Logo" class="logo" onerror="this.style.display='none'">
  
  <h2>Cek Pesanan</h2>
  <div class="subtitle">Masukkan kode grup dan nama pemesan</div>

  <!-- Input Kode Grup -->
  <div class="form-group">
    <label for="kodeGrup">Kode Grup</label>
    <input 
      type="text" 
      id="kodeGrup" 
      placeholder="Contoh: G1/G2/G3"
    >
  </div>

  <!-- Input Nama Pemesan -->
  <div class="form-group">
    <label for="namaPemesan">Nama Pemesan</label>
    <input 
      type="text" 
      id="namaPemesan" 
      placeholder="Masukkan nama sesuai pesanan" 
      onkeypress="handleKeyPress(event)"
    >
  </div>

  <button class="btn-submit" onclick="cariPesanan()">SUBMIT</button>

  <div id="loading" class="loading">⏳ Memuat data pesanan...</div>
  <div id="hasilPencarian"></div>

  <!-- Footer Fitur & Copyright -->
  <div class="features">
    <div><strong>Mudah Dicek</strong><br>Cek cepat</div>
    <div><strong>Aman</strong><br>Data terjaga</div>
    <div><strong>Praktis</strong><br>Tanpa ribet</div>
  </div>

  <div class="footer-text">
    SEMURA · Baby & Mom<br>
    © 2026 SEMURA · Since 2022
  </div>
</div>

<script>
  // Ganti dengan URL Web App Apps Script kamu
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx1OQ5ff3qb7B8M-1zNgz38HZ8oHTUEjMv2b8LUZUIqjg6w9VEQqMcn1FDhzzF-ZujJoQ/exec";

  function handleKeyPress(event) {
    if (event.key === "Enter") {
      cariPesanan();
    }
  }

  async function cariPesanan() {
    const kodeGrupInput = document.getElementById('kodeGrup').value.trim();
    const namaInput = document.getElementById('namaPemesan').value.trim();
    const hasilContainer = document.getElementById('hasilPencarian');
    const loading = document.getElementById('loading');

    if (!kodeGrupInput && !namaInput) {
      alert("Masukkan Kode Grup atau Nama Pemesan terlebih dahulu!");
      return;
    }

    // Mengambil kata kunci pencarian
    const keyword = kodeGrupInput || namaInput;

    hasilContainer.innerHTML = "";
    loading.style.display = "block";

    try {
      const response = await fetch(${APPS_SCRIPT_URL}?query=${encodeURIComponent(keyword)});
      const data = await response.json();

      loading.style.display = "none";

      if (!data || data.length === 0) {
        hasilContainer.innerHTML = <div style="text-align:center; color:#888; font-size:13px; margin-top:15px;">Data tidak ditemukan. Pastikan Kode Grup atau Nama sudah sesuai.</div>;
        return;
      }

      data.forEach(item => {
        const isDone = item.statusPembayaran && item.statusPembayaran.toString().toLowerCase().includes("done");
        const statusBadge = isDone 
          ? <span class="badge badge-done">${item.statusPembayaran}</span> 
          : <span class="badge badge-pending">${item.statusPembayaran || 'Pending'}</span>;

        const htmlCard = `
          <div class="card">
            <div class="card-title">📖 ${item.judulBuku || item.judul || '-'}</div>
            <div class="card-row"><span>Nama Pemesan:</span> <strong>${item.namaPemesan || item.nama || '-'}</strong></div>
            <div class="card-row"><span>Kode Grup:</span> <strong>${item.kodeGrup || '-'}</strong></div>
            <div class="card-row"><span>Hari Ke-:</span> <span>${item.hariKe || '-'}</span></div>
            <div class="card-row"><span>Harga:</span> <span>Rp ${item.harga || 0}</span></div>
            <div class="card-row"><span>Kuantitas:</span> <span>${item.kuantitas || 0}</span></div>
            <div class="card-row"><span>Jumlah:</span> <strong>Rp ${item.jumlah || 0}</strong></div>
            <div class="card-row"><span>Status Bayar:</span> ${statusBadge}</div>
            <div class="card-row"><span>Status Pengiriman:</span> <strong>${item.statusPengiriman || item.status || '-'}</strong></div>
          </div>
        `;
        hasilContainer.innerHTML += htmlCard;
      });

    } catch (error) {
      loading.style.display = "none";
      hasilContainer.innerHTML = <div style="text-align:center; color:red; font-size:13px; margin-top:15px;">Gagal mengambil data. Periksa koneksi internet atau URL Apps Script.</div>;
    }
  }
</script>

</body>
</html>
