<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEMURA - Cek Pesanan</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
    .search-box { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    input[type="text"] { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; }
    input[type="text"]:focus { border-color: #007bff; }
    button { padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: #0056b3; }
    .loading { text-align: center; color: #666; display: none; margin: 15px 0; }
    .card { background: #fafafa; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 12px; }
    .card-header { font-weight: bold; font-size: 16px; border-bottom: 1px solid #ddd; padding-bottom: 8px; margin-bottom: 8px; color: #007bff; }
    .card-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; }
    .card-row .label { color: #666; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-done { background-color: #d4edda; color: #155724; }
    .badge-pending { background-color: #fff3cd; color: #856404; }
    .no-result { text-align: center; color: #888; margin-top: 20px; }
  </style>
</head>
<body>

<div class="container">
  <h2>SEMURA - Cek Pesanan</h2>
  
  <div class="search-box">
    <input type="text" id="inputCari" placeholder="Masukkan Kode Grup / No. WA..." onkeypress="handleKeyPress(event)">
    <button onclick="cariPesanan()">Cek Pesanan</button>
  </div>

  <div id="loading" class="loading">⏳ Memuat data pesanan...</div>
  <div id="hasilPencarian"></div>
</div>

<script>
  // Ganti dengan URL Web App Apps Script kamu yang baru dideploy
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx1OQ5ff3qb7B8M-1zNgz38HZ8oHTUEjMv2b8LUZUIqjg6w9VEQqMcn1FDhzzF-ZujJoQ/exec";

  function handleKeyPress(event) {
    if (event.key === "Enter") {
      cariPesanan();
    }
  }

  async function cariPesanan() {
    const keyword = document.getElementById('inputCari').value.trim();
    const hasilContainer = document.getElementById('hasilPencarian');
    const loading = document.getElementById('loading');

    if (!keyword) {
      alert("Masukkan Kode Grup atau Nomor WhatsApp terlebih dahulu!");
      return;
    }

    hasilContainer.innerHTML = "";
    loading.style.display = "block";

    try {
      const response = await fetch(${APPS_SCRIPT_URL}?query=${encodeURIComponent(keyword)});
      const data = await response.json();

      loading.style.display = "none";

      if (data.length === 0) {
        hasilContainer.innerHTML = <div class="no-result">Data tidak ditemukan. Pastikan Kode Grup atau Nomor WA sudah benar.</div>;
        return;
      }

      data.forEach(item => {
        const isDone = item.statusPembayaran.toString().toLowerCase().includes("done");
        const statusBadge = isDone 
          ? <span class="badge badge-done">${item.statusPembayaran}</span> 
          : <span class="badge badge-pending">${item.statusPembayaran || 'Pending'}</span>;

        const htmlCard = `
          <div class="card">
            <div class="card-header">${item.judulBuku || '-'}</div>
            <div class="card-row"><span class="label">Nama Pemesan:</span> <strong>${item.namaPemesan || '-'}</strong></div>
            <div class="card-row"><span class="label">Kode Grup:</span> <span>${item.kodeGrup || '-'}</span></div>
            <div class="card-row"><span class="label">Hari Ke-:</span> <span>${item.hariKe || '-'}</span></div>
            <div class="card-row"><span class="label">Harga:</span> <span>Rp ${item.harga || 0}</span></div>
            <div class="card-row"><span class="label">Kuantitas:</span> <span>${item.kuantitas || 0}</span></div>
            <div class="card-row"><span class="label">Total Jumlah:</span> <strong>Rp ${item.jumlah || 0}</strong></div>
            <div class="card-row"><span class="label">Status Bayar:</span> ${statusBadge}</div>
            <div class="card-row"><span class="label">Status Pengiriman:</span> <span>${item.statusPengiriman || '-'}</span></div>
          </div>
        `;
        hasilContainer.innerHTML += htmlCard;
      });

    } catch (error) {
      loading.style.display = "none";
      hasilContainer.innerHTML = <div class="no-result" style="color: red;">Terjadi kesalahan saat mengambil data. Coba lagi nanti.</div>;
    }
  }
</script>

</body>
</html>
